# XcodeGen project definition for Arcadia.
# Generate the Xcode project on a Mac with:  xcodegen generate
# (brew install xcodegen).
#
# The Chromium engine is the prebuilt CRWebView.framework under
# third_party/crwebview/ (produced by Scripts/fetch_chromium.sh +
# Scripts/build_crwebview.sh — not committed). The framework bundles its own
# sub-process helper apps (Versions/A/Helpers) and runtime payload, so the app
# only needs to embed the single framework.

name: Arcadia
options:
  minimumXcodeGenVersion: "2.40.0"
  bundleIdPrefix: app.arcadia
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Prebuilt engine framework lives here (built from Chromium source).
    CRWEBVIEW_ROOT: "$(SRCROOT)/third_party/crwebview"
    FRAMEWORK_SEARCH_PATHS:
      - "$(CRWEBVIEW_ROOT)"
      - "$(inherited)"

targets:
  Arcadia:
    type: application
    platform: macOS
    sources:
      - path: Sources/Arcadia
    dependencies:
      # Prebuilt; embedded into Contents/Frameworks (brings its helpers along).
      - framework: third_party/crwebview/CRWebView.framework
        embed: true
        codeSign: true
    settings:
      base:
        INFOPLIST_FILE: Sources/Arcadia/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Arcadia/Resources/Arcadia.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.arcadia.Arcadia
        # App Sandbox is OFF (Chromium multi-process + Developer ID). See README.
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
